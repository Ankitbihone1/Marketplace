spring:
  application:
    name: marketplace
  datasource:
    url: jdbc:postgresql://localhost:5432/bajrix_db
    username: bajrix_user
    password: bajrix_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
